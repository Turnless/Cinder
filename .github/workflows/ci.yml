name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npx vitest run

      - name: Build
        run: npm run build
        env:
          # db.js refuses to start in production without a database URL; a throwaway local file satisfies it in CI
          TURSO_DATABASE_URL: file:ci-build.db

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: contracts/package-lock.json

      - run: npm ci

      - name: Contract tests
        run: npx hardhat test
        env:
          HARDHAT_DISABLE_TELEMETRY_PROMPT: 'true'
